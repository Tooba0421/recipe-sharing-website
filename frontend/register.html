<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipe Hub - Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">🍲 Recipe Hub</a>
  <nav class="main-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="browse.html">Browse Recipes</a></li>
      <li><a href="submit.html">Submit Recipe</a></li>
      <li><a href="login.html" class="active" id="navUserLink">User Profile</a></li>
    </ul>
  </nav>
</header>

<main class="page-container">
  <h1 class="page-heading">Create an Account</h1>

  <div class="form-container">
    <form id="registerForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
      <p id="formMessage" class="form-message"></p>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
  </div>
</main>

<footer class="site-footer">
  &copy; 2026 Recipe Hub. All rights reserved.
</footer>

<script src="js/config.js"></script>
<script src="js/register.js"></script>
</body>
</html>
