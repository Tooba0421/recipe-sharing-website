<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipe Hub - Submit Recipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">🍲 Recipe Hub</a>
  <nav class="main-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="browse.html">Browse Recipes</a></li>
      <li><a href="submit.html" class="active">Submit Recipe</a></li>
      <li><a href="login.html" id="navUserLink">User Profile</a></li>
    </ul>
  </nav>
</header>

<main class="page-container">
  <h1 class="page-heading">Submit a Recipe</h1>

  <div class="form-container">
    <form id="submitRecipeForm">
      <div class="form-group">
        <label for="title">Recipe Title</label>
        <input type="text" id="title" required />
      </div>

      <div class="form-group">
        <label for="ingredients">Ingredients</label>
        <textarea id="ingredients" placeholder="One ingredient per line" required></textarea>
        <div class="form-hint">Enter one ingredient per line.</div>
      </div>

      <div class="form-group">
        <label for="instructions">Instructions</label>
        <textarea id="instructions" placeholder="One step per line" required></textarea>
        <div class="form-hint">Enter one step per line.</div>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="Breakfast">Breakfast</option>
          <option value="Vegan">Vegan</option>
          <option value="Desserts">Desserts</option>
          <option value="Lunch">Lunch</option>
          <option value="Dinner">Dinner</option>
        </select>
      </div>

      <div class="form-group">
        <label for="time">Cooking Time (minutes)</label>
        <input type="number" id="time" min="1" required />
      </div>

      <button type="submit" class="btn btn-primary">Submit Recipe</button>
      <p id="formMessage" class="form-message"></p>
    </form>
  </div>
</main>

<footer class="site-footer">
  &copy; 2026 Recipe Hub. All rights reserved.
</footer>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="js/submit.js"></script>
</body>
</html>
